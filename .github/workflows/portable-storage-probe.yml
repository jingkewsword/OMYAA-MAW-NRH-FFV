name: Portable storage diagnostic
on:
  push:
    branches: [code/portable-storage-probe-20261107]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'jingkewsword/OMYAA-MAW-NRH-FFV'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare temporary and persistent profiles
        env:
          MAW_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: pnpm exec playwright test --config=tests/config/playwright.config.mjs --project=chromium tests/e2e/portable-storage-probe.spec.mjs --workers=1 --retries=0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: portable-storage-probe
          path: test-results/
          retention-days: 7
