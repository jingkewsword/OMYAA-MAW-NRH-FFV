name: Editor build and contracts

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editor-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      application: ${{ steps.plan.outputs.application }}
      real_media: ${{ steps.plan.outputs.real_media }}
      tools_scope: ${{ steps.plan.outputs.tools_scope }}
      common: ${{ steps.plan.outputs.common }}
      browser: ${{ steps.plan.outputs.browser }}
      smoke: ${{ steps.plan.outputs.smoke }}
      media: ${{ steps.plan.outputs.media }}
      long_media: ${{ steps.plan.outputs.long_media }}
      lifecycle: ${{ steps.plan.outputs.lifecycle }}
      tools: ${{ steps.plan.outputs.tools }}
      editor_e2e: ${{ steps.plan.outputs.editor_e2e }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_specs: ${{ steps.plan.outputs.e2e_specs }}
      website: ${{ steps.plan.outputs.website }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: plan
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$TEST_BASE_REF" || "$TEST_BASE_REF" =~ ^0+$ ]]; then
            python scripts/test_workflow.py --stage release --plan-only --github-output "$GITHUB_OUTPUT"
          else
            python scripts/test_workflow.py --stage merge --base-ref "$TEST_BASE_REF" --plan-only --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: test-selection
          path: .artifacts/test-workflow/
          include-hidden-files: true

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/test_workflow.py --stage merge --pack docs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: documentation-evidence
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7

  editor:
    needs: selection
    if: needs.selection.outputs.app == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The test runner builds each bundle exactly once before its consumers.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        if: needs.selection.outputs.application == 'true' || needs.selection.outputs.tools_scope != 'checklist'
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --frozen --group test --group dev --no-group build
        if: needs.selection.outputs.application == 'true' || needs.selection.outputs.tools_scope != 'checklist'
      - run: pnpm exec playwright install chromium
        if: needs.selection.outputs.browser == 'true' || needs.selection.outputs.smoke == 'true' || needs.selection.outputs.e2e == 'true' || needs.selection.outputs.editor_e2e == 'true'
      - name: Verify Windows symlink capability
        if: needs.selection.outputs.common == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP ("maw-symlink-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $probe | Out-Null
          try {
            Set-Content -LiteralPath (Join-Path $probe 'target') -Value 'symlink-capable'
            New-Item -ItemType SymbolicLink -Path (Join-Path $probe 'alias') -Target (Join-Path $probe 'target') | Out-Null
            if ((Get-Content -LiteralPath (Join-Path $probe 'alias')) -ne 'symlink-capable') { throw 'Symlink target is unreadable.' }
          } finally {
            Remove-Item -LiteralPath (Join-Path $probe 'alias') -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $probe 'target') -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $probe -Force
          }
      - name: Select real Git Bash checksum tools
        if: needs.selection.outputs.tools == 'true' && needs.selection.outputs.tools_scope != 'checklist'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) { throw 'Git Bash is unavailable.' }
          & $gitBash -c 'command -v sha256sum && command -v awk && command -v grep'
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash checksum tools are unavailable.' }
          (Split-Path $gitBash) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install real media dependencies
        if: needs.selection.outputs.real_media == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          $binary = Get-ChildItem -LiteralPath "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $binary) { throw 'The FFmpeg package contains no executable.' }
          $ffprobe = Join-Path $binary.Directory.FullName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) { throw 'FFprobe is unavailable.' }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $binary.FullName -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is unavailable.' }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe is unavailable.' }
      - name: Required common and impacted gates
        env:
          COMMON: ${{ needs.selection.outputs.common }}
          BROWSER: ${{ needs.selection.outputs.browser }}
          SMOKE: ${{ needs.selection.outputs.smoke }}
          MEDIA: ${{ needs.selection.outputs.media }}
          LONG_MEDIA: ${{ needs.selection.outputs.long_media }}
          LIFECYCLE: ${{ needs.selection.outputs.lifecycle }}
          TOOLS: ${{ needs.selection.outputs.tools }}
          E2E: ${{ needs.selection.outputs.e2e }}
          E2E_SPECS: ${{ needs.selection.outputs.e2e_specs }}
          TOOLS_SCOPE: ${{ needs.selection.outputs.tools_scope }}
          APPLICATION: ${{ needs.selection.outputs.application }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packs = @()
          foreach ($name in @('common', 'browser', 'smoke', 'media', 'long-media', 'lifecycle', 'tools', 'e2e')) {
            $flag = [Environment]::GetEnvironmentVariable($name.Replace('-', '_').ToUpperInvariant())
            if ($flag -eq 'true') { $packs += @('--pack', $name) }
          }
          $arguments = @('scripts/test_workflow.py', '--stage', 'merge', '--tools-scope', $env:TOOLS_SCOPE, '--e2e-specs', $env:E2E_SPECS) + $packs
          if ($env:APPLICATION -eq 'false' -and $env:TOOLS_SCOPE -eq 'checklist') {
            python @arguments
          } else {
            uv run --no-sync python @arguments
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editor-test-evidence
          path: |
            .artifacts/
            test-results/
          include-hidden-files: true
          retention-days: 7

  posix-contracts:
    needs: selection
    if: needs.selection.outputs.common == 'true' || needs.selection.outputs.lifecycle == 'true' || (needs.selection.outputs.tools == 'true' && needs.selection.outputs.tools_scope != 'checklist') || needs.selection.outputs.media == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --frozen --group test --no-group build --no-dev
      - uses: pnpm/action-setup@v6
        if: needs.selection.outputs.lifecycle == 'true'
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        if: needs.selection.outputs.lifecycle == 'true'
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: needs.selection.outputs.lifecycle == 'true'
      - name: POSIX path and symlink contracts
        if: needs.selection.outputs.common == 'true'
        run: >-
          uv run --no-sync python scripts/run_check.py --timeout 120 --
          uv run --no-sync python scripts/run_tests.py --required --report .artifacts/posix-paths.json
          tests.test_editor_manifest.EditorManifestTests.test_rejects_symlink_escape
          tests.test_editor_manifest.EditorManifestTests.test_accepts_symlink_within_web_directory
          tests.test_asr_presets.RecognitionPresetTests.test_symbolic_links_are_unavailable_and_cannot_be_loaded
          tests.test_thumbnail_cache.ThumbnailCacheTests.test_symlink_registration_matches_resolved_source_namespace
          tests.test_gui_web.GuiWebBridgeTests.test_open_existing_path_uses_external_opener_for_file_and_folder
      - name: Unix checksum contracts
        if: needs.selection.outputs.tools == 'true' && needs.selection.outputs.tools_scope != 'checklist'
        run: >-
          uv run --no-sync python scripts/run_check.py --timeout 120 --
          uv run --no-sync python scripts/run_tests.py --required --report .artifacts/posix-checksum.json
          tests.test_verify_sha256_script
      - name: POSIX process lifecycle
        if: needs.selection.outputs.lifecycle == 'true'
        run: uv run --no-sync python scripts/test_workflow.py --stage merge --pack lifecycle
      - name: Prepare bounded Ubuntu package downloads
        if: needs.selection.outputs.media == 'true'
        run: sudo "$(command -v python)" scripts/prepare_ci_apt.py
      - name: Linux real media dependencies
        if: needs.selection.outputs.media == 'true'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Linux real bad-file probe contracts
        if: needs.selection.outputs.media == 'true'
        run: >-
          uv run --no-sync python scripts/run_check.py --timeout 180 --
          uv run --no-sync python scripts/run_tests.py --required --report .artifacts/posix-ffprobe.json
          tests.test_ffprobe_failure_integration
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: posix-contract-evidence
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7

  website:
    needs: selection
    if: needs.selection.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: pnpm --dir website install --frozen-lockfile
      - run: python scripts/test_workflow.py --stage merge --pack website

  browser-gates:
    needs: selection
    if: needs.selection.outputs.editor_e2e == 'true'
    uses: ./.github/workflows/browser-gates.yml

  test-gate:
    name: Required test gate
    if: always()
    needs: [selection, documentation, editor, posix-contracts, browser-gates, website]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reject failure, cancellation and unexpected skipped jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python scripts/check_test_gate.py
