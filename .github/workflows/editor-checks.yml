name: Editor build and contracts

on:
  pull_request:
  push:
    branches: [main, 2.0dev]

permissions:
  contents: read

concurrency:
  group: editor-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      docs: ${{ steps.scope.outputs.docs }}
      website: ${{ steps.scope.outputs.website }}
      python: ${{ steps.scope.outputs.python }}
      node: ${{ steps.scope.outputs.node }}
      readme_node: ${{ steps.scope.outputs.readme_node }}
      browser: ${{ steps.scope.outputs.browser }}
      application: ${{ steps.scope.outputs.application }}
      python_dependencies: ${{ steps.scope.outputs.python_dependencies }}
      real_media: ${{ steps.scope.outputs.real_media }}
      ubuntu_python: ${{ steps.scope.outputs.ubuntu_python }}
      windows_node: ${{ steps.scope.outputs.windows_node }}
      windows_python: ${{ steps.scope.outputs.windows_python }}
      browser_matrix: ${{ steps.matrix.outputs.browser_matrix }}
      browser_shards: ${{ steps.matrix.outputs.browser_shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Select change scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci_impact.py
      - name: Expand selected browser shards
        id: matrix
        env:
          CI_PLAN: ${{ steps.scope.outputs.plan }}
          CI_BROWSER_SHARDS: ${{ vars.MAW_CI_BROWSER_SHARDS }}
        run: |
          python -c "import os,pathlib; p=pathlib.Path('.artifacts/ci-plan.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(os.environ['CI_PLAN'],encoding='utf-8')"
          python scripts/ci_matrix.py expand

  website:
    needs: selection
    if: ${{ needs.selection.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm --dir website install --frozen-lockfile
      - name: README content synchronization
        if: ${{ needs.selection.outputs.readme_node != 'true' }}
        run: python scripts/run_check.py --timeout 180 -- node --test tests/test_readme_content_sync.mjs
      - name: Website document consumers
        run: |
          python scripts/run_check.py --timeout 180 -- pnpm --dir website run sync:docs
          python scripts/run_check.py --timeout 180 -- python scripts/build_release_site.py --preview
          python scripts/run_check.py --timeout 300 -- pnpm --dir website run build
      - uses: actions/upload-artifact@v6
        with:
          name: selected-website-dist
          path: website/dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: [selection, website]
    if: ${{ always() && needs.selection.result == 'success' && needs.selection.outputs.browser == 'true' && (needs.website.result == 'success' || needs.website.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.browser_matrix) }}
    env:
      PYTHONUTF8: '1'
      CI_PLAN: ${{ needs.selection.outputs.plan }}
      MAW_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
      MAW_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Save selected plan
        run: python -c "import os,pathlib; p=pathlib.Path('.artifacts/ci-plan.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(os.environ['CI_PLAN'],encoding='utf-8')"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build browser application
        if: ${{ needs.selection.outputs.application == 'true' }}
        run: python scripts/run_check.py --timeout 180 -- pnpm run build
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
          enable-cache: true
      - run: uv sync --frozen --group test --group dev
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install FFmpeg
        if: ${{ needs.selection.outputs.real_media == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Restore website for its browser consumers
        if: ${{ needs.selection.outputs.website == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: selected-website-dist
          path: website/dist/
      - name: Discover and run selected browser shard
        run: uv run --no-sync python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer browser --shard ${{ matrix.shard }}/${{ matrix.total }} --report-dir .artifacts/ci-browser
      - name: Preserve browser shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: selected-browser-${{ matrix.shard }}
          path: |
            .artifacts/ci-browser/
            .artifacts/checks/
            test-results/
          include-hidden-files: true
          retention-days: 7

  browser-gate:
    needs: [selection, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and browser jobs
        if: ${{ needs.selection.result != 'success' || (needs.selection.outputs.browser == 'true' && needs.browser.result != 'success') || (needs.selection.outputs.browser == 'false' && needs.browser.result != 'skipped') }}
        run: exit 1
      - uses: actions/checkout@v5
        if: ${{ needs.selection.outputs.browser == 'true' }}
      - uses: actions/setup-python@v6
        if: ${{ needs.selection.outputs.browser == 'true' }}
        with:
          python-version: '3.11'
      - name: Save selected plan
        if: ${{ needs.selection.outputs.browser == 'true' }}
        env:
          CI_PLAN: ${{ needs.selection.outputs.plan }}
        run: python -c "import os,pathlib; p=pathlib.Path('.artifacts/ci-plan.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(os.environ['CI_PLAN'],encoding='utf-8')"
      - uses: actions/download-artifact@v7
        if: ${{ needs.selection.outputs.browser == 'true' }}
        with:
          pattern: selected-browser-*
          path: .artifacts/browser-evidence/
      - name: Require complete matching browser outcomes
        if: ${{ needs.selection.outputs.browser == 'true' }}
        run: python scripts/ci_matrix.py gate --total ${{ needs.selection.outputs.browser_shards }}

  debug-tools:
    name: Debug tooling (${{ matrix.os }})
    needs: selection
    if: ${{ needs.selection.outputs.docs == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Documentation navigation and consumers
        run: python scripts/run_check.py --timeout 180 -- python scripts/check_docs.py
      - name: Offline tool documentation freshness
        run: python scripts/run_check.py --timeout 60 -- node scripts/build-tool-docs.mjs --check
      - name: Release documents
        run: python scripts/run_check.py --timeout 60 -- python scripts/prepare_release_notes.py --check-all
      - name: Preserve failed check evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debug-tools-${{ matrix.os }}
          path: .artifacts/checks/
          include-hidden-files: true
          retention-days: 7

  windows-lifecycle:
    name: Existing Windows contracts
    needs: selection
    if: ${{ needs.selection.outputs.windows_node == 'true' || needs.selection.outputs.windows_python == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      CI_PLAN: ${{ needs.selection.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: ${{ needs.selection.outputs.windows_node == 'true' }}
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11'
      - name: Save selected plan
        run: python -c "import os,pathlib; p=pathlib.Path('.artifacts/ci-plan.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(os.environ['CI_PLAN'],encoding='utf-8')"
      # Replaces the old unconditional Windows lifecycle checks with their
      # intersection with the shared selection; no application install.
      - name: Selected Windows lifecycle contracts
        if: ${{ needs.selection.outputs.windows_node == 'true' }}
        env:
          MAW_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          MAW_E2E_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer node-windows-existing --report-dir .artifacts/ci-windows-node
      - name: Selected Windows standard-library Python contracts on push
        if: ${{ needs.selection.outputs.windows_python == 'true' }}
        run: python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer python-windows-existing --report-dir .artifacts/ci-windows-python
      - name: Preserve Windows lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: selected-windows-lifecycle
          path: |
            .artifacts/ci-windows-node/
            .artifacts/ci-windows-python/
            .artifacts/checks/
          include-hidden-files: true
          retention-days: 7

  editor-tests:
    needs: selection
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CI_PLAN: ${{ needs.selection.outputs.plan }}
      MAW_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
      MAW_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - name: Require valid selection
        if: ${{ needs.selection.result != 'success' || needs.selection.outputs.plan == '' }}
        run: exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Save selected plan
        run: python -c "import os,pathlib; p=pathlib.Path('.artifacts/ci-plan.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(os.environ['CI_PLAN'],encoding='utf-8')"
      - uses: pnpm/action-setup@v6
        if: ${{ needs.selection.outputs.application == 'true' || needs.selection.outputs.node == 'true' }}
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        if: ${{ needs.selection.outputs.application == 'true' || needs.selection.outputs.node == 'true' }}
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install application JavaScript dependencies
        if: ${{ needs.selection.outputs.application == 'true' || needs.selection.outputs.node == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and typecheck application
        if: ${{ needs.selection.outputs.application == 'true' }}
        run: |
          python scripts/run_check.py --timeout 180 -- pnpm run build
          python scripts/run_check.py --timeout 180 -- pnpm run typecheck
      - uses: astral-sh/setup-uv@v7
        if: ${{ needs.selection.outputs.node == 'true' || (needs.selection.outputs.python_dependencies == 'true' && (needs.selection.outputs.ubuntu_python == 'true' || (github.event_name == 'push' && needs.selection.outputs.python == 'true'))) }}
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Install Python dependencies
        if: ${{ needs.selection.outputs.node == 'true' || (needs.selection.outputs.python_dependencies == 'true' && (needs.selection.outputs.ubuntu_python == 'true' || (github.event_name == 'push' && needs.selection.outputs.python == 'true'))) }}
        run: uv sync --frozen --group test --group dev
      - name: Install Chromium
        if: ${{ needs.selection.outputs.node == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Install FFmpeg
        if: ${{ needs.selection.outputs.real_media == 'true' && (needs.selection.outputs.node == 'true' || needs.selection.outputs.ubuntu_python == 'true' || (github.event_name == 'push' && needs.selection.outputs.python == 'true')) }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Selected Python tests on push
        if: ${{ github.event_name == 'push' && needs.selection.outputs.python == 'true' && needs.selection.outputs.python_dependencies == 'true' }}
        run: uv run --no-sync python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer python --report-dir .artifacts/ci-python
      - name: Selected standard-library Python tests on push
        if: ${{ github.event_name == 'push' && needs.selection.outputs.python == 'true' && needs.selection.outputs.python_dependencies == 'false' }}
        run: python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer python --report-dir .artifacts/ci-python
      # Original Editor/debug Python contracts retain Ubuntu coverage only for
      # their selected intersection; the Windows Preview owns the PR suite.
      - name: Selected existing Ubuntu Python contracts
        if: ${{ needs.selection.outputs.ubuntu_python == 'true' && needs.selection.outputs.python_dependencies == 'true' }}
        run: uv run --no-sync python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer python-ubuntu-existing --report-dir .artifacts/ci-ubuntu-python
      - name: Selected existing Ubuntu standard-library contracts
        if: ${{ needs.selection.outputs.ubuntu_python == 'true' && needs.selection.outputs.python_dependencies == 'false' }}
        run: python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer python-ubuntu-existing --report-dir .artifacts/ci-ubuntu-python
      - name: Selected Node tests
        if: ${{ needs.selection.outputs.node == 'true' }}
        run: uv run --no-sync python scripts/test_workflow.py --stage merge --selection-plan .artifacts/ci-plan.json --layer node --report-dir .artifacts/ci-node
      - name: Preserve selected test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: editor-selected-evidence
          path: |
            .artifacts/ci-plan.json
            .artifacts/ci-*/
            .artifacts/checks/
            test-results/
          include-hidden-files: true
          retention-days: 7

  editor:
    needs: [selection, editor-tests, browser-gate, website, debug-tools, windows-lifecycle]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks
        if: ${{ needs.selection.result != 'success' || needs.editor-tests.result != 'success' || needs.browser-gate.result != 'success' || (needs.selection.outputs.website == 'true' && needs.website.result != 'success') || (needs.selection.outputs.website == 'false' && needs.website.result != 'skipped') || (needs.selection.outputs.docs == 'true' && needs.debug-tools.result != 'success') || (needs.selection.outputs.docs == 'false' && needs.debug-tools.result != 'skipped') || ((needs.selection.outputs.windows_node == 'true' || needs.selection.outputs.windows_python == 'true') && needs.windows-lifecycle.result != 'success') || (needs.selection.outputs.windows_node == 'false' && needs.selection.outputs.windows_python == 'false' && needs.windows-lifecycle.result != 'skipped') }}
        run: exit 1
