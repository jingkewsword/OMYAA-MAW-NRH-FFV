name: ASS Linux diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation python3-pil
      - run: /usr/bin/python3 diagnostic-ass/experiment.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ass-linux-diagnostic
          path: diagnostic-ass/output/
          if-no-files-found: error
