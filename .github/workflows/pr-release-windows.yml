name: PR29 A-D Linux diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - run: uv sync --frozen --group test --group dev --no-group build
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg fonts-noto-cjk
        timeout-minutes: 5
      - name: Instrumented keyboard spec
        run: uv run --no-sync python scripts/run_check.py --timeout 600 -- pnpm exec playwright test --config tests/config/playwright.config.mjs tests/e2e/keyboard-timing.spec.mjs --project=chromium --workers=2 --retries=0 --trace=on --output=.artifacts/ad-diagnostic
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ad-linux-diagnostic
          path: |
            .artifacts/checks/
            .artifacts/ad-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
