name: Complete browser coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-tests:
    name: Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --frozen --group test --no-group build --no-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Discover and execute the required partition
        run: uv run --no-sync python scripts/test_workflow.py --stage merge --pack editor-e2e --browser-shard ${{ matrix.shard }}/4
      - name: Preserve shard coverage record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-shard-${{ matrix.shard }}
          path: .artifacts/test-workflow/**/browser-run.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve discovery, logs and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            .artifacts/checks/
            .artifacts/test-workflow/**/plan.json
            .artifacts/test-workflow/**/summary.json
            .artifacts/test-workflow/**/browser*.json
            .artifacts/test-workflow/**/browser-artifacts/
            output/playwright/
          include-hidden-files: true
          retention-days: 7

  browser-coverage:
    name: Require every browser case exactly once
    if: always()
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          pattern: browser-shard-*
          path: .artifacts/browser-shards
      - name: Validate revision, scope, partition and actual passing results
        run: python scripts/browser_results.py --reports .artifacts/browser-shards --total 4
      - name: Require every matrix job to finish successfully
        env:
          BROWSER_JOBS_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_JOBS_RESULT" = success
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-coverage
          path: .artifacts/browser-coverage.json
          include-hidden-files: true
          retention-days: 7
